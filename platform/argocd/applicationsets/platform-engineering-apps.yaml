apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform-engineering-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/amr-elzoghby/Internal-Developer-Platform.git'
        revision: main
        directories:
          - path: apps/platform-engineering/*
  template:
    metadata:
      name: 'platform-engineering-{{path.basename}}'
    spec:
      project: platform-engineering
      source:
        repoURL: 'https://github.com/amr-elzoghby/Internal-Developer-Platform.git'
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: platform-engineering
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - FailOnSharedResource=true
