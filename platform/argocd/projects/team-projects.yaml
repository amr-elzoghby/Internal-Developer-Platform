apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: identity-platform
  namespace: argocd
spec:
  description: "Argo CD project for Identity Platform workloads"
  destinations:
    - namespace: identity-platform
      server: https://kubernetes.default.svc
  sourceRepos:
    - 'https://github.com/amr-elzoghby/Internal-Developer-Platform.git'
  namespaceResourceWhitelist:
    - group: ''
      kind: ConfigMap
    - group: ''
      kind: PersistentVolumeClaim
    - group: ''
      kind: Service
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: batch
      kind: CronJob
    - group: batch
      kind: Job
    - group: networking.k8s.io
      kind: Ingress
    - group: policy
      kind: PodDisruptionBudget
  clusterResourceWhitelist: []
  orphanedResources:
    warn: true

