---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-infra
  namespace: argocd
spec:
  description: "ArgoCD Project for Platform Infrastructure & Crossplane Claims"
  destinations:
    - namespace: identity-platform
      server: https://kubernetes.default.svc
    - namespace: platform-engineering
      server: https://kubernetes.default.svc
    - namespace: data-platform
      server: https://kubernetes.default.svc
  sourceRepos:
    - 'https://github.com/amr-elzoghby/Internal-Developer-Platform.git'
  namespaceResourceWhitelist:
    - group: idp.io
      kind: ObjectBucket
    - group: idp.io
      kind: PostgresSQLInstance
    - group: idp.io
      kind: RedisInstance
    - group: idp.io
      kind: ServerInstance
    - group: external-secrets.io
      kind: ExternalSecret
    - group: external-secrets.io
      kind: SecretStore
  clusterResourceWhitelist: []
  orphanedResources:
    warn: true
