sync:
  toHost:
    pods:
      enabled: true
      useSecretsForSATokens: true
    services:
      enabled: true
    ingresses:
      enabled: false
    namespaces:
      enabled: false
    # A vCluster is one team trust boundary. Tenant-authored NetworkPolicies
    # stay disabled because standard policies are additive and could reopen
    # the platform-managed host boundary with an unrestricted ipBlock rule.
    networkPolicies:
      enabled: false
  fromHost:
    nodes:
      enabled: false

controlPlane:
  service:
    spec:
      type: ClusterIP
  ingress:
    enabled: false
  tlsRoute:
    enabled: false
  statefulSet:
    pods:
      labels:
        platform.idp.io/component: vcluster-control-plane
    persistence:
      volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes: [ "ReadWriteOnce" ]
            storageClassName: gp3
            resources:
              requests:
                storage: 5Gi

# Namespace guardrails are managed separately under host-namespaces so they
# exist before Helm creates the optional vCluster control plane.
policies:
  resourceQuota:
    enabled: false
  limitRange:
    enabled: false
  networkPolicy:
    enabled: false
