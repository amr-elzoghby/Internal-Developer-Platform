apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  role: idp-prod-karpenter-nodes-role
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: idp-prod
  securityGroupSelectorTerms:
    - tags:
        "aws:eks:cluster-name": idp-prod
  amiSelectorTerms:
    - alias: al2023@v20260827
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 1
    httpTokens: required
