apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: identity-platform-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: 'https://github.com/amr-elzoghby/Internal-Developer-Platform.git'
        revision: main
        directories:
          - path: apps/identity-platform/*
  template:
    metadata:
      name: 'identity-platform-{{path.basename}}'
    spec:
      project: identity-platform
      source:
        repoURL: 'https://github.com/amr-elzoghby/Internal-Developer-Platform.git'
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: identity-platform
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - FailOnSharedResource=true
