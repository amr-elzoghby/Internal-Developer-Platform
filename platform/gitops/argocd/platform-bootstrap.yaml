apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-bootstrap
  namespace: argocd
spec:
  project: platform-bootstrap
  source:
    repoURL: https://github.com/amr-elzoghby/Internal-Developer-Platform.git
    targetRevision: main
    path: platform/gitops/argocd/bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
      - FailOnSharedResource=true
