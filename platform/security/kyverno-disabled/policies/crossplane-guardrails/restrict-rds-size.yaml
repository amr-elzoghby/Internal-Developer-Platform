apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-crossplane-rds-size
  annotations:
    policies.kyverno.io/title: Restrict RDS Instance Size
    policies.kyverno.io/category: Crossplane Infrastructure Guardrails
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: PostgresSQLInstance
    policies.kyverno.io/description: >-
      To prevent runaway AWS cloud costs, developer database claims are restricted
      to approved tier sizes ('small' or 'medium'). Large instances are blocked.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-rds-size
      match:
        any:
          - resources:
              kinds:
                - idp.io/v1alpha1/PostgresSQLInstance
      validate:
        message: "Database size '{{request.object.spec.size}}' is not allowed. Approved sizes are 'small' or 'medium'."
        pattern:
          spec:
            size: "small | medium"
