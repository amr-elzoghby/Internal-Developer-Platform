apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      Privileged containers can access all devices on the host node and bypass
      isolation boundaries. This policy blocks containers running with privileged mode.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: check-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        resources:
          namespaces:
            - kube-system
            - kyverno
            - crossplane-system
      validate:
        message: "Running privileged containers is strictly forbidden in team environments."
        pattern:
          spec:
            =(containers):
              - =(securityContext):
                  =(privileged): "false"
