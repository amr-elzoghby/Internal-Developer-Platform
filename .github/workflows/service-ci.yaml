name: Service CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
  workflow_dispatch:
    inputs:
      service_path:
        description: 'Service path (e.g. apps/team-alpha/login-app)'
        required: false

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::851236938302:role/idp-prod-github-actions-role
  ECR_REGISTRY: 851236938302.dkr.ecr.us-east-1.amazonaws.com

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect Changed Services
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.service_path }}" ]; then
            SERVICES='["${{ github.event.inputs.service_path }}"]'
          else
            # Find all unique service directories that changed under apps/
            SERVICES=$(git diff --name-only HEAD~1 HEAD -- 'apps/' \
              | cut -d'/' -f1-3 \
              | sort -u \
              | jq -R -s 'split("\n") | map(select(length > 0))' )
          fi
          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Detected services: $SERVICES"

  build-and-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]' && needs.detect-changes.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service_path: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Service Info
        id: info
        run: |
          SERVICE_PATH="${{ matrix.service_path }}"
          TEAM=$(echo "$SERVICE_PATH" | cut -d'/' -f2)
          APP=$(echo "$SERVICE_PATH" | cut -d'/' -f3)
          echo "service_path=$SERVICE_PATH" >> $GITHUB_OUTPUT
          echo "team=$TEAM" >> $GITHUB_OUTPUT
          echo "app=$APP" >> $GITHUB_OUTPUT
          echo "ecr_repository=idp-$TEAM-$APP" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names ${{ steps.info.outputs.ecr_repository }} || \
          aws ecr create-repository --repository-name ${{ steps.info.outputs.ecr_repository }} \
            --image-scanning-configuration scanOnPush=true \
            --encryption-configuration encryptionType=AES256

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}/${{ steps.info.outputs.ecr_repository }}:${{ steps.info.outputs.image_tag }} ./${{ steps.info.outputs.service_path }}

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ steps.info.outputs.ecr_repository }}:${{ steps.info.outputs.image_tag }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push Image to ECR
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ steps.info.outputs.ecr_repository }}:${{ steps.info.outputs.image_tag }}

      - name: Update GitOps Manifest Tag
        run: |
          MANIFEST_FILE="./${{ steps.info.outputs.service_path }}/deployment.yaml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i "s|image: .*|image: ${{ env.ECR_REGISTRY }}/${{ steps.info.outputs.ecr_repository }}:${{ steps.info.outputs.image_tag }}|g" "$MANIFEST_FILE"
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add "$MANIFEST_FILE"
            git commit -m "image: update ${{ steps.info.outputs.app }} tag to ${{ steps.info.outputs.image_tag }} [skip ci]"
            git push
          fi
