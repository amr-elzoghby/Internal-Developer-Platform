name: Service CI/CD
on:
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/service-ci.yaml', 'platform/validation/**']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions: {}
# Runs are independent. Every run reconciles all source services, including a
# service whose earlier run failed. No workflow-wide pending-run cancellation.
env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::851236938302:role/idp-prod-github-actions-role
  ECR_REGISTRY: 851236938302.dkr.ecr.us-east-1.amazonaws.com
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      services: ${{ steps.services.outputs.services }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - id: services
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: echo "services=$(python3 platform/validation/delivery.py inventory --changed-since "$BEFORE_SHA")" >> "$GITHUB_OUTPUT"
  build_scan:
    needs: inventory
    if: needs.inventory.outputs.services != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service_path: ${{ fromJSON(needs.inventory.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install PyYAML==6.0.3
      - name: Build and exercise the isolated container
        env:
          SERVICE_PATH: ${{ matrix.service_path }}
        run: |
          set -euo pipefail
          docker build --tag idp-ci:build "$SERVICE_PATH"
          python3 platform/validation/smoke-container.py "$SERVICE_PATH" idp-ci:build
          mkdir -p artifact
          docker save idp-ci:build --output artifact/image.tar
          python3 platform/validation/delivery.py revision "$SERVICE_PATH" > artifact/source-revision
          sha256sum artifact/image.tar > artifact/image.sha256
      - name: Scan before obtaining any cloud credentials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: idp-ci:build
          format: table
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
      - name: Produce SPDX SBOM without cloud credentials
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: idp-ci:build
          format: spdx-json
          output: artifact/sbom.spdx.json
          skip-setup-trivy: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ strategy.job-index }}
          path: artifact/
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [inventory, build_scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service_path: ${{ fromJSON(needs.inventory.outputs.services) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-${{ strategy.job-index }}
          path: artifact
      - name: Validate and load scanned artifact
        run: |
          sha256sum --check artifact/image.sha256
          docker load --input artifact/image.tar
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 900
      - name: Publish to provisioned ECR repository
        id: image
        env:
          SERVICE_PATH: ${{ matrix.service_path }}
        run: |
          set -euo pipefail
          repository="idp-${SERVICE_PATH#apps/}"
          repository="${repository//\//-}"
          python3 platform/validation/check-ecr.py "$repository"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag idp-ci:build "$ECR_REGISTRY/$repository:$tag"
          docker push "$ECR_REGISTRY/$repository:$tag"
          digest="$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$digest" > artifact/digest
          printf '%s\n' "$ECR_REGISTRY/$repository" > artifact/repository
          docker logout "$ECR_REGISTRY"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "repository=$ECR_REGISTRY/$repository" >> "$GITHUB_OUTPUT"
      - name: Clear AWS credentials before artifact upload
        run: |
          for key in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN; do
            echo "$key=" >> "$GITHUB_ENV"
          done
      - name: Attest build provenance for the published digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: false
      - name: Attest SPDX SBOM for the same digest
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: artifact/sbom.spdx.json
          push-to-registry: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ strategy.job-index }}
          path: |
            artifact/source-revision
            artifact/digest
            artifact/repository
          retention-days: 1
          if-no-files-found: error
  promotion:
    needs: [inventory, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        service_path: ${{ fromJSON(needs.inventory.outputs.services) }}
    steps:
      - run: python3 -m pip install PyYAML==6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ strategy.job-index }}
          path: /tmp/release
      - name: Repository-scoped bot token (so PR quality workflows run)
        id: bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.DELIVERY_APP_ID }}
          private-key: ${{ secrets.DELIVERY_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.bot.outputs.token }}
      - name: Open a reviewed digest promotion
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          SERVICE_PATH: ${{ matrix.service_path }}
        run: |
          set -euo pipefail
          python3 platform/validation/delivery.py promote "$SERVICE_PATH" \
            --digest "$(cat /tmp/release/digest)" --revision "$(cat /tmp/release/source-revision)" --build-revision "$GITHUB_SHA"
          python3 platform/validation/delivery.py validate
          branch="automation/image-${SERVICE_PATH#apps/}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          branch="${branch//\//-}"
          git switch --create "$branch"
          git config user.name 'idp-delivery[bot]'
          git config user.email 'idp-delivery@users.noreply.github.com'
          git add -- "$SERVICE_PATH/deployment.yaml" "$SERVICE_PATH/kustomization.yaml" "$SERVICE_PATH/delivery.json"
          git commit -m "ci(images): promote $SERVICE_PATH to verified digest"
          git push --set-upstream origin "HEAD:refs/heads/$branch"
          cat > /tmp/promotion-body.md <<'BODY'
          Promote the scanned image digest and enable this service's explicit Kustomize deployment. Review the image, source revision, quality checks and provenance before merging. Roll back by reverting this promotion in Git.
          BODY
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --title "ci(images): promote $SERVICE_PATH" --body-file /tmp/promotion-body.md
