name: Repository quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: |
          python -m pip install PyYAML==6.0.3 jsonschema==4.26.0 protobuf==6.33.5 cel-python==0.2.0 lupa==2.6
          npm ci --ignore-scripts --prefix platform/validation
          npm ci --ignore-scripts --prefix platform/developer-portal/local-catalog
          npm test --prefix platform/developer-portal/local-catalog
          python platform/validation/validate.py
          python -m unittest discover -s platform/validation -p 'test_*.py'
      - name: Platform regression checks
        run: |
          python -m unittest discover -s platform/operations/tests -p 'test_*.py'
          python infrastructure/crossplane/scripts/validate-compositions.py --download
          make test-destroy-guard
      - name: Workflow and shell lint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.11
          "$(go env GOPATH)/bin/actionlint"
          git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
      - name: Prometheus alert behavior
        run: |
          curl --fail --silent --show-error --location https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz --output "$RUNNER_TEMP/prometheus.tar.gz"
          printf 'f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d  %s\n' "$RUNNER_TEMP/prometheus.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/prometheus.tar.gz" --directory "$RUNNER_TEMP" --strip-components=1 prometheus-3.14.0.linux-amd64/promtool
          python platform/observability/prometheus/test-alerts.py --promtool "$RUNNER_TEMP/promtool"
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.4'
      - name: Formatting and isolated validation
        run: |
          terraform fmt -check -recursive infrastructure/terraform
          for root in infrastructure/terraform/stacks/bootstrap/state infrastructure/terraform/stacks/prod/network infrastructure/terraform/stacks/prod/eks infrastructure/terraform/stacks/prod/controllers; do
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
          done
          terraform -chdir=infrastructure/terraform/stacks/prod/network test
          terraform -chdir=infrastructure/terraform/modules/eks init -backend=false -input=false -lockfile=readonly
          terraform -chdir=infrastructure/terraform/modules/eks test
  kubernetes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.35.1
      - run: npm ci --ignore-scripts --prefix platform/validation
      - name: Render controllers and tenant resources
        run: bash platform/validation/render-kubernetes.sh
  template-containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        template: [nodejs-service, python-fastapi]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render and build the actual starter
        env:
          TEMPLATE: ${{ matrix.template }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix platform/validation
          python3 -m pip install PyYAML==6.0.3
          node platform/validation/render-templates.js "templates/backstage/$TEMPLATE/skeleton" /tmp/service '{"component_id":"ci-service","owner":"identity-platform","namespace":"identity-platform","description":"CI service"}'
          docker build --tag template:ci /tmp/service
          python3 platform/validation/smoke-container.py /tmp/service template:ci
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: template:ci
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: false
  application-containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare scanner and scan source dependency locks
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: apps
          scanners: vuln
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Build and exercise every repository-owned service before merge
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
          python3 platform/validation/delivery.py inventory > /tmp/services.json
          python3 - <<'PY'
          import json,subprocess
          for service in json.load(open('/tmp/services.json')):
              subprocess.run(['docker','build','--tag','service:ci',service], check=True)
              subprocess.run(['python3','platform/validation/smoke-container.py',service,'service:ci'], check=True)
              subprocess.run(['trivy','image','--image-src','docker','--scanners','vuln','--severity','HIGH,CRITICAL','--exit-code','1','service:ci'], check=True)
          PY
