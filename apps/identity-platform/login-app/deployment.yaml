apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  name: login-app
  namespace: identity-platform
  labels:
    app: login-app
    team: identity-platform
    backstage.io/kubernetes-id: login-app
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: login-app
  template:
    metadata:
      labels:
        platform.idp.io/alb-target: "true"
        platform.idp.io/postgres-client: "true"
        app: login-app
        team: identity-platform
        backstage.io/kubernetes-id: login-app
    spec:
      serviceAccountName: tenant-workload
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: login-app
        image: pending-build.invalid/login-app:source-recovery-required
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          tcpSocket:
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          tcpSocket:
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          tcpSocket:
            port: http
          periodSeconds: 20
          timeoutSeconds: 2
          failureThreshold: 3
        env:
        - name: PORT
          value: '3000'
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: identity-platform-db-conn
              key: host
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: identity-platform-db-conn
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: identity-platform-db-conn
              key: password
        - name: DB_NAME
          value: postgres
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              name: identity-platform-db-conn
              key: port
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: login-app
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: login-app
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: login-app
  namespace: identity-platform
  labels:
    app: login-app
    team: identity-platform
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: login-app
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: login-app
  namespace: identity-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: login-app
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: login-app
  namespace: identity-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: login-app
  minReplicas: 2
  maxReplicas: 6
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
