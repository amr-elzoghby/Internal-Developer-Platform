apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-nodejs-microservice
  title: Create Node.js Microservice (Golden Path)
  description: Scaffold a Node.js Express service starter with Docker and Kubernetes manifests.
  tags:
    - nodejs
    - express
    - kubernetes
spec:
  owner: platform-engineering
  type: service

  parameters:
    - title: Service Configuration
      required:
        - component_id
        - owner
        - image_repository
        - image_tag
      properties:
        component_id:
          title: Component Name
          type: string
          description: Unique name for your microservice (e.g., payment-service)
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Short explanation of what this service does
          default: Node.js Microservice
        owner:
          title: Owner Team
          type: string
          description: Select the platform-managed team that owns and runs this microservice
          enum:
            - identity-platform
            - platform-engineering
            - data-platform
          enumNames:
            - Identity Platform
            - Platform Engineering
            - Data Platform
        image_repository:
          title: Container Image Repository
          type: string
          description: Full registry/repository path without a tag
          pattern: '^[^@\s]+$'
        image_tag:
          title: Immutable Image Tag
          type: string
          description: Full 40-character Git commit SHA for the prebuilt image; latest is not accepted
          pattern: '^[0-9a-f]{40}$'

    - title: Git Repository Destination
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Target Repository URL
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: fetch-skeleton
      name: Fetch Golden Path Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.owner }}
          image_repository: ${{ parameters.image_repository }}
          image_tag: ${{ parameters.image_tag }}

    - id: publish-github
      name: Publish Repository to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        protectDefaultBranch: true

    - id: register-catalog
      name: Register Component in Backstage Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps['publish-github'].output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: GitHub Repository
        url: ${{ steps['publish-github'].output.remoteUrl }}
      - title: View in Catalog
        icon: catalog
        entityRef: ${{ steps['register-catalog'].output.entityRef }}
