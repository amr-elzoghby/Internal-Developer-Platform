apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: serverinstances.idp.io
spec:
  scope: Namespaced
  group: idp.io
  names:
    kind: ServerInstance
    plural: serverinstances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
                  default: small
                  enum:
                    - small
                    - medium
                ami:
                  type: string
                  description: AMI ID that exists in the target AWS region.
                  pattern: '^ami-([0-9a-f]{8}|[0-9a-f]{17})$'
              required:
                - size
                - ami
