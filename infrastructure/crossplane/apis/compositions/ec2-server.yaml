apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: serverinstances.idp.io
spec:
  compositeTypeRef:
    apiVersion: idp.io/v1alpha1
    kind: ServerInstance
  mode: Pipeline
  pipeline:
    - step: python-script
      functionRef:
        name: function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          from crossplane.function.proto.v1 import run_function_pb2 as fnv1

          def compose(req, rsp):
              composite = req.observed.composite.resource
              # Ownership survives cluster loss in AWS tags; expiry triggers review, never deletion.
              metadata = composite["metadata"]
              lifecycle = composite["spec"]
              resource_tags = {
                  "ManagedBy": "Crossplane-IDP",
                  "Environment": "${ENVIRONMENT}",
                  "TenantNamespace": metadata["namespace"],
                  "ClaimName": metadata["name"],
                  "Owner": lifecycle["owner"],
                  "ExpiresOn": lifecycle["expiresOn"],
              }
              spec = composite["spec"] if "spec" in composite else {}
              size = spec["size"] if "size" in spec else "small"
              ami = "${APPROVED_SERVER_AMI_ID}"
              
              # Map user size to EC2 Instance Class
              instance_type = "t3.micro"
              if size == "medium":
                  instance_type = "t3.small"

              # 1. Security Group for EC2 Instance
              sg = {
                  "apiVersion": "ec2.aws.m.upbound.io/v1beta1",
                  "kind": "SecurityGroup",
                  "spec": {
                      "managementPolicies": [
                          "Create",
                          "Observe",
                          "Update",
                          "LateInitialize"
                      ],
                      "providerConfigRef": {
                          "kind": "ClusterProviderConfig",
                          "name": "default"
                      },
                      "forProvider": {
                          "region": "${AWS_REGION}",
                          "description": "EC2 Server Security Group",
                          "vpcId": "${VPC_ID}",
                          "tags": resource_tags
                      }
                  }
              }

              # 1b. SSM uses outbound TLS; utility hosts have no inbound ports.
              sg_rule_ssm = {
                  "apiVersion": "ec2.aws.m.upbound.io/v1beta1",
                  "kind": "SecurityGroupRule",
                  "spec": {
                      "managementPolicies": [
                          "Create",
                          "Observe",
                          "Update",
                          "LateInitialize"
                      ],
                      "providerConfigRef": {
                          "kind": "ClusterProviderConfig",
                          "name": "default"
                      },
                      "forProvider": {
                          "region": "${AWS_REGION}",
                          "securityGroupIdSelector": {
                              "matchControllerRef": True
                          },
                          "type": "egress",
                          "fromPort": 443,
                          "toPort": 443,
                          "protocol": "tcp",
                          "cidrBlocks": ["0.0.0.0/0"]
                      }
                  }
              }

              # 2. EC2 Instance
              ec2 = {
                  "apiVersion": "ec2.aws.m.upbound.io/v1beta1",
                  "kind": "Instance",
                  "spec": {
                      "managementPolicies": [
                          "Create",
                          "Observe",
                          "Update",
                          "LateInitialize"
                      ],
                      "providerConfigRef": {
                          "kind": "ClusterProviderConfig",
                          "name": "default"
                      },
                      "forProvider": {
                          "region": "${AWS_REGION}",
                          "ami": ami,
                          "instanceType": instance_type,
                          "associatePublicIpAddress": False,
                          "iamInstanceProfile": "${EC2_INSTANCE_PROFILE_NAME}",
                          "metadataOptions": {
                              "httpEndpoint": "enabled",
                              "httpTokens": "required",
                              "httpPutResponseHopLimit": 1,
                              "instanceMetadataTags": "disabled",
                          },
                          "rootBlockDevice": {
                              "encrypted": True,
                              "volumeType": "gp3",
                              "volumeSize": 20,
                              "deleteOnTermination": True,
                          },
                          "userData": "#!/bin/bash\nset -euo pipefail\nsystemctl enable --now amazon-ssm-agent\n",
                          "userDataReplaceOnChange": True,
                          "subnetId": "${PRIVATE_SUBNET_1}",
                          "vpcSecurityGroupIdSelector": {
                              "matchControllerRef": True
                          },
                          "tags": resource_tags
                      }
                  }
              }

              # Helper to check readiness
              def is_ready(name):
                  if name in req.observed.resources:
                      obs = req.observed.resources[name].resource
                      status = obs["status"] if "status" in obs else {}
                      conditions = status["conditions"] if "conditions" in status else []
                      for cond in conditions:
                          if "type" in cond and cond["type"] == "Ready" and "status" in cond and cond["status"] == "True":
                              return True
                  return False

              rsp.desired.resources["server-sg"].resource.update(sg)
              rsp.desired.resources["server-sg"].ready = (
                  fnv1.READY_TRUE if is_ready("server-sg") else fnv1.READY_FALSE
              )

              rsp.desired.resources["server-sg-rule-ssm"].resource.update(sg_rule_ssm)
              rsp.desired.resources["server-sg-rule-ssm"].ready = (
                  fnv1.READY_TRUE if is_ready("server-sg-rule-ssm") else fnv1.READY_FALSE
              )

              rsp.desired.resources["ec2-instance"].resource.update(ec2)
              rsp.desired.resources["ec2-instance"].ready = (
                  fnv1.READY_TRUE if is_ready("ec2-instance") else fnv1.READY_FALSE
              )
