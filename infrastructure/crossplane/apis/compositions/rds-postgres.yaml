apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgressqlinstances.idp.io
spec:
  compositeTypeRef:
    apiVersion: idp.io/v1alpha1
    kind: PostgresSQLInstance
  mode: Pipeline
  pipeline:
    - step: python-script
      functionRef:
        name: function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          from crossplane.function.proto.v1 import run_function_pb2 as fnv1

          MANAGEMENT_POLICIES = [
              "Create",
              "Observe",
              "Update",
              "LateInitialize",
          ]

          def compose(req, rsp):
              composite = req.observed.composite.resource
              # Ownership survives cluster loss in AWS tags; expiry triggers review, never deletion.
              metadata = composite["metadata"]
              lifecycle = composite["spec"]
              resource_tags = {
                  "ManagedBy": "Crossplane-IDP",
                  "Environment": "${ENVIRONMENT}",
                  "TenantNamespace": metadata["namespace"],
                  "ClaimName": metadata["name"],
                  "Owner": lifecycle["owner"],
                  "ExpiresOn": lifecycle["expiresOn"],
              }
              metadata = composite["metadata"]
              spec = composite["spec"] if "spec" in composite else {}
              namespace = metadata["namespace"]
              db_name = metadata["name"]
              storage = spec["storageGB"] if "storageGB" in spec else 20
              size = spec["size"] if "size" in spec else "small"

              # The XRD enum limits this lookup to platform-approved tiers.
              instance_classes = {
                  "small": "db.t3.micro",
                  "medium": "db.t3.small",
              }
              instance_class = instance_classes[size]

              # The node SG is the AWS boundary; tenant NetworkPolicy narrows clients.
              security_group = {
                  "apiVersion": "ec2.aws.m.upbound.io/v1beta1",
                  "kind": "SecurityGroup",
                  "metadata": {
                      "name": f"{db_name}-rds-sg",
                      "namespace": namespace,
                  },
                  "spec": {
                      "managementPolicies": MANAGEMENT_POLICIES,
                      "providerConfigRef": {
                          "kind": "ClusterProviderConfig",
                          "name": "default",
                      },
                      "forProvider": {
                          "region": "${AWS_REGION}",
                          "description": f"RDS security group for {namespace}/{db_name}",
                          "vpcId": "${VPC_ID}",
                          "tags": resource_tags,
                      },
                  },
              }

              security_group_rule = {
                  "apiVersion": "ec2.aws.m.upbound.io/v1beta1",
                  "kind": "SecurityGroupRule",
                  "metadata": {
                      "name": f"{db_name}-rds-ingress",
                      "namespace": namespace,
                  },
                  "spec": {
                      "managementPolicies": MANAGEMENT_POLICIES,
                      "providerConfigRef": {
                          "kind": "ClusterProviderConfig",
                          "name": "default",
                      },
                      "forProvider": {
                          "region": "${AWS_REGION}",
                          "securityGroupIdSelector": {
                              "namespace": namespace,
                              "matchControllerRef": True,
                          },
                          "type": "ingress",
                          "fromPort": 5432,
                          "toPort": 5432,
                          "protocol": "tcp",
                          "sourceSecurityGroupId": "${EKS_NODE_SECURITY_GROUP_ID}",
                      },
                  },
              }

              subnet_group = {
                  "apiVersion": "rds.aws.m.upbound.io/v1beta1",
                  "kind": "SubnetGroup",
                  "metadata": {
                      "name": f"{db_name}-rds-subnets",
                      "namespace": namespace,
                  },
                  "spec": {
                      "managementPolicies": MANAGEMENT_POLICIES,
                      "providerConfigRef": {
                          "kind": "ClusterProviderConfig",
                          "name": "default",
                      },
                      "forProvider": {
                          "region": "${AWS_REGION}",
                          "description": f"RDS subnet group for {namespace}/{db_name}",
                          "subnetIds": ["${DATA_SUBNET_1}", "${DATA_SUBNET_2}"],
                          "tags": resource_tags,
                      },
                  },
              }

              rds_instance = {
                  "apiVersion": "rds.aws.m.upbound.io/v1beta1",
                  "kind": "Instance",
                  "metadata": {
                      "name": db_name,
                      "namespace": namespace,
                  },
                  "spec": {
                      "managementPolicies": MANAGEMENT_POLICIES,
                      "providerConfigRef": {
                          "kind": "ClusterProviderConfig",
                          "name": "default",
                      },
                      "forProvider": {
                          "region": "${AWS_REGION}",
                          "allocatedStorage": storage,
                          "storageType": "gp3",
                          "storageEncrypted": True,
                          "backupRetentionPeriod": 7,
                          "multiAz": True,
                          "backupWindow": "01:00-02:00",
                          "maintenanceWindow": "sun:03:00-sun:04:00",
                          "skipFinalSnapshot": False,
                          "finalSnapshotIdentifier": f"idp-final-{metadata['uid'][:12]}",
                          "deleteAutomatedBackups": False,
                          "monitoringInterval": 60,
                          "monitoringRoleArn": "${RDS_MONITORING_ROLE_ARN}",
                          "databaseInsightsMode": "standard",
                          "performanceInsightsEnabled": True,
                          "performanceInsightsRetentionPeriod": 7,
                          "enabledCloudwatchLogsExports": ["postgresql", "upgrade"],
                          "copyTagsToSnapshot": True,
                          "deletionProtection": True,
                          "dbSubnetGroupNameSelector": {
                              "namespace": namespace,
                              "matchControllerRef": True,
                          },
                          "vpcSecurityGroupIdSelector": {
                              "namespace": namespace,
                              "matchControllerRef": True,
                          },
                          "engine": "postgres",
                          "engineVersion": "15.19",
                          "autoMinorVersionUpgrade": True,
                          "instanceClass": instance_class,
                          "publiclyAccessible": False,
                          "username": "postgres",
                          "passwordSecretRef": {
                              "name": f"{db_name}-password",
                              "key": "password",
                          },
                          "tags": resource_tags,
                      },
                      "writeConnectionSecretToRef": {
                          "name": f"{db_name}-conn",
                      },
                  },
              }

              def is_ready(name):
                  if name in req.observed.resources:
                      observed = req.observed.resources[name].resource
                      status = observed["status"] if "status" in observed else {}
                      conditions = status["conditions"] if "conditions" in status else []
                      for condition in conditions:
                          if (
                              "type" in condition
                              and condition["type"] == "Ready"
                              and "status" in condition
                              and condition["status"] == "True"
                          ):
                              return True
                  return False

              resources = {
                  "security-group": security_group,
                  "security-group-rule": security_group_rule,
                  "subnet-group": subnet_group,
                  "rds-instance": rds_instance,
              }
              for name, resource in resources.items():
                  rsp.desired.resources[name].resource.update(resource)
                  rsp.desired.resources[name].ready = (
                      fnv1.READY_TRUE if is_ready(name) else fnv1.READY_FALSE
                  )
