apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgressqlinstances.idp.io
spec:
  scope: Namespaced
  defaultCompositionUpdatePolicy: Manual
  enforcedCompositionRef:
    name: postgressqlinstances.idp.io
  group: idp.io
  names:
    kind: PostgresSQLInstance
    plural: postgressqlinstances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                owner:
                  type: string
                  description: Accountable tenant team; admission requires the namespace owner.
                  enum: [identity-platform, platform-engineering, data-platform]
                expiresOn:
                  type: string
                  format: date
                  description: Review-by date in YYYY-MM-DD; expiry never deletes cloud resources.
                storageGB:
                  type: integer
                  description: Allocated encrypted gp3 storage in GiB.
                  default: 20
                  minimum: 20
                  maximum: 1000
                size:
                  type: string
                  description: Platform-approved RDS capacity tier.
                  default: small
                  enum:
                    - small
                    - medium
              required:
                - owner
                - expiresOn
                - storageGB
                - size
