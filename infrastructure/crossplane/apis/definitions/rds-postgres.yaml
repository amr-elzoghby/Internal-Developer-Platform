apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: postgressqlinstances.idp.io
spec:
  scope: Namespaced
  group: idp.io
  names:
    kind: PostgresSQLInstance
    plural: postgressqlinstances
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                storageGB:
                  type: integer
                  description: Allocated encrypted gp3 storage in GiB.
                  default: 20
                  minimum: 20
                  maximum: 1000
                size:
                  type: string
                  description: Platform-approved RDS capacity tier.
                  default: small
                  enum:
                    - small
                    - medium
              required:
                - storageGB
                - size
