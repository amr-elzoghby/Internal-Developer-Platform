apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: objectbuckets.idp.io
spec:
  scope: Namespaced
  defaultCompositionUpdatePolicy: Manual
  enforcedCompositionRef:
    name: objectbuckets.idp.io
  group: idp.io
  names:
    kind: ObjectBucket
    plural: objectbuckets
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                owner:
                  type: string
                  description: Accountable tenant team; admission requires the namespace owner.
                  enum: [identity-platform, platform-engineering, data-platform]
                expiresOn:
                  type: string
                  format: date
                  description: Review-by date in YYYY-MM-DD; expiry never deletes cloud resources.
                region:
                  type: string
                  default: us-east-1
                  enum: [us-east-1]
              required:
                - owner
                - expiresOn
                - region
