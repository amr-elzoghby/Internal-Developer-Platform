apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xobjectbuckets.idp.io
spec:
  compositeTypeRef:
    apiVersion: idp.io/v1alpha1
    kind: XObjectBucket
  mode: Pipeline
  pipeline:
    - step: python-script
      functionRef:
        name: function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          def compose(req, rsp):
              composite = req.observed.composite.resource
              spec = composite["spec"] if "spec" in composite else {}
              region = spec["region"] if "region" in spec else "us-east-1"
              bucket_name = f"idp-prod-crossplane-{composite['metadata']['uid']}"
              
              bucket = {
                  "apiVersion": "s3.aws.upbound.io/v1beta1",
                  "kind": "Bucket",
                  "metadata": {
                      "annotations": {
                          "crossplane.io/external-name": bucket_name
                      }
                  },
                  "spec": {
                      "deletionPolicy": "Orphan",
                      "forProvider": {
                          "region": region,
                          "tags": {
                              "ManagedBy": "Crossplane-IDP",
                              "Environment": "prod"
                          }
                      }
                  }
              }
              
              rsp.desired.resources["bucket"].resource.update(bucket)
