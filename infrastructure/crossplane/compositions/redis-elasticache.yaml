apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: redisinstances.idp.io
spec:
  compositeTypeRef:
    apiVersion: idp.io/v1alpha1
    kind: RedisInstance
  mode: Pipeline
  pipeline:
    - step: python-script
      functionRef:
        name: function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          from crossplane.function.proto.v1 import run_function_pb2 as fnv1

          def compose(req, rsp):
              composite = req.observed.composite.resource
              spec = composite["spec"] if "spec" in composite else {}
              size = spec["size"] if "size" in spec else "small"
              namespace = composite["metadata"]["namespace"]
              redis_name = composite["metadata"]["name"]

              node_type = "cache.t3.micro"
              if size == "medium":
                  node_type = "cache.t3.small"

              # 1. Security Group for Redis
              sg = {
                  "apiVersion": "ec2.aws.m.upbound.io/v1beta1",
                  "kind": "SecurityGroup",
                  "metadata": {
                      "namespace": namespace
                  },
                  "spec": {
                      "managementPolicies": [
                          "Create",
                          "Observe",
                          "Update",
                          "LateInitialize"
                      ],
                      "providerConfigRef": {
                          "kind": "ClusterProviderConfig",
                          "name": "default"
                      },
                      "forProvider": {
                          "region": "us-east-1",
                          "description": "Redis Security Group",
                          "vpcId": "${VPC_ID}",
                          "tags": {
                              "ManagedBy": "Crossplane-IDP",
                              "Environment": "prod"
                          }
                      }
                  }
              }

              # 1b. Security Group Rule for Redis
              sg_rule = {
                  "apiVersion": "ec2.aws.m.upbound.io/v1beta1",
                  "kind": "SecurityGroupRule",
                  "metadata": {
                      "namespace": namespace
                  },
                  "spec": {
                      "managementPolicies": [
                          "Create",
                          "Observe",
                          "Update",
                          "LateInitialize"
                      ],
                      "providerConfigRef": {
                          "kind": "ClusterProviderConfig",
                          "name": "default"
                      },
                      "forProvider": {
                          "region": "us-east-1",
                          "securityGroupIdSelector": {
                              "matchControllerRef": True,
                              "namespace": namespace
                          },
                          "type": "ingress",
                          "fromPort": 6379,
                          "toPort": 6379,
                          "protocol": "tcp",
                          "cidrBlocks": ["10.0.0.0/16"]
                      }
                  }
              }

              # 2. ElastiCache Subnet Group
              subnet_group = {
                  "apiVersion": "elasticache.aws.m.upbound.io/v1beta1",
                  "kind": "SubnetGroup",
                  "metadata": {
                      "namespace": namespace
                  },
                  "spec": {
                      "managementPolicies": [
                          "Create",
                          "Observe",
                          "Update",
                          "LateInitialize"
                      ],
                      "providerConfigRef": {
                          "kind": "ClusterProviderConfig",
                          "name": "default"
                      },
                      "forProvider": {
                          "region": "us-east-1",
                          "description": "Redis Subnet Group",
                          "subnetIds": ["${PRIVATE_SUBNET_1}", "${PRIVATE_SUBNET_2}"],
                          "tags": {
                              "ManagedBy": "Crossplane-IDP",
                              "Environment": "prod"
                          }
                      }
                  }
              }

              # 3. Redis Replication Group
              redis = {
                  "apiVersion": "elasticache.aws.m.upbound.io/v1beta1",
                  "kind": "ReplicationGroup",
                  "metadata": {
                      "namespace": namespace
                  },
                  "spec": {
                      "managementPolicies": [
                          "Create",
                          "Observe",
                          "Update",
                          "LateInitialize"
                      ],
                      "providerConfigRef": {
                          "kind": "ClusterProviderConfig",
                          "name": "default"
                      },
                      "forProvider": {
                          "region": "us-east-1",
                          "description": "ElastiCache Redis cluster",
                          "engine": "redis",
                          "engineVersion": "7.1",
                          "nodeType": node_type,
                          "numCacheClusters": 1,
                          "subnetGroupNameSelector": {
                              "matchControllerRef": True,
                              "namespace": namespace
                          },
                          "securityGroupIdSelector": {
                              "matchControllerRef": True,
                              "namespace": namespace
                          },
                          "tags": {
                              "ManagedBy": "Crossplane-IDP",
                              "Environment": "prod"
                          }
                      },
                      "writeConnectionSecretToRef": {
                          "name": f"{redis_name}-conn"
                      }
                  }
              }

              def is_ready(name):
                  if name in req.observed.resources:
                      observed = req.observed.resources[name].resource
                      status = observed["status"] if "status" in observed else {}
                      conditions = status["conditions"] if "conditions" in status else []
                      for condition in conditions:
                          if "type" in condition and condition["type"] == "Ready" and "status" in condition and condition["status"] == "True":
                              return True
                  return False

              rsp.desired.resources["security-group"].resource.update(sg)
              rsp.desired.resources["security-group"].ready = (
                  fnv1.READY_TRUE if is_ready("security-group") else fnv1.READY_FALSE
              )

              rsp.desired.resources["security-group-rule"].resource.update(sg_rule)
              rsp.desired.resources["security-group-rule"].ready = (
                  fnv1.READY_TRUE if is_ready("security-group-rule") else fnv1.READY_FALSE
              )

              rsp.desired.resources["subnet-group"].resource.update(subnet_group)
              rsp.desired.resources["subnet-group"].ready = (
                  fnv1.READY_TRUE if is_ready("subnet-group") else fnv1.READY_FALSE
              )

              rsp.desired.resources["redis-instance"].resource.update(redis)
              rsp.desired.resources["redis-instance"].ready = (
                  fnv1.READY_TRUE if is_ready("redis-instance") else fnv1.READY_FALSE
              )
