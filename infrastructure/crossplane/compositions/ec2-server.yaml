apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: xserverinstances.idp.io
spec:
  compositeTypeRef:
    apiVersion: idp.io/v1alpha1
    kind: XServerInstance
  mode: Pipeline
  pipeline:
    - step: python-script
      functionRef:
        name: function-python
      input:
        apiVersion: python.fn.crossplane.io/v1beta1
        kind: Script
        script: |
          def compose(req, rsp):
              composite = req.observed.composite.resource
              spec = composite["spec"] if "spec" in composite else {}
              size = spec["size"] if "size" in spec else "small"
              ami = spec["ami"] if "ami" in spec else "ami-0c7217cdde317cfec"
              
              # Map user size to EC2 Instance Class
              instance_type = "t3.micro"
              if size == "medium":
                  instance_type = "t3.small"
              elif size == "large":
                  instance_type = "t3.medium"

              # 1. Security Group for EC2 Instance
              sg = {
                  "apiVersion": "ec2.aws.upbound.io/v1beta1",
                  "kind": "SecurityGroup",
                  "spec": {
                      "deletionPolicy": "Orphan",
                      "forProvider": {
                          "region": "us-east-1",
                          "description": "EC2 Server Security Group",
                          "vpcId": "${VPC_ID}",
                          "tags": {
                              "ManagedBy": "Crossplane-IDP",
                              "Environment": "prod"
                          }
                      }
                  }
              }

              # 1b. Ingress Rule for HTTP (Port 80)
              sg_rule_http = {
                  "apiVersion": "ec2.aws.upbound.io/v1beta1",
                  "kind": "SecurityGroupRule",
                  "spec": {
                      "deletionPolicy": "Orphan",
                      "forProvider": {
                          "region": "us-east-1",
                          "securityGroupIdSelector": {
                              "matchControllerRef": True
                          },
                          "type": "ingress",
                          "fromPort": 80,
                          "toPort": 80,
                          "protocol": "tcp",
                          "cidrBlocks": ["10.0.0.0/16"]
                      }
                  }
              }

              # 2. EC2 Instance
              ec2 = {
                  "apiVersion": "ec2.aws.upbound.io/v1beta1",
                  "kind": "Instance",
                  "spec": {
                      "deletionPolicy": "Orphan",
                      "forProvider": {
                          "region": "us-east-1",
                          "ami": ami,
                          "instanceType": instance_type,
                          "subnetId": "${PRIVATE_SUBNET_1}",
                          "vpcSecurityGroupIdSelector": {
                              "matchControllerRef": True
                          },
                          "tags": {
                              "Name": "idp-developer-server",
                              "ManagedBy": "Crossplane-IDP",
                              "Environment": "prod"
                          }
                      }
                  }
              }

              # Helper to check readiness
              def is_ready(name):
                  if name in req.observed.resources:
                      obs = req.observed.resources[name].resource
                      status = obs["status"] if "status" in obs else {}
                      conditions = status["conditions"] if "conditions" in status else []
                      for cond in conditions:
                          if "type" in cond and cond["type"] == "Ready" and "status" in cond and cond["status"] == "True":
                              return True
                  return False

              rsp.desired.resources["server-sg"].resource.update(sg)
              rsp.desired.resources["server-sg"].ready = 1 if is_ready("server-sg") else 2

              rsp.desired.resources["server-sg-rule-http"].resource.update(sg_rule_http)
              rsp.desired.resources["server-sg-rule-http"].ready = 1 if is_ready("server-sg-rule-http") else 2

              rsp.desired.resources["ec2-instance"].resource.update(ec2)
              rsp.desired.resources["ec2-instance"].ready = 1 if is_ready("ec2-instance") else 2
