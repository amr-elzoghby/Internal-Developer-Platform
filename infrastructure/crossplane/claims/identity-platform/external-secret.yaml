apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-platform-db-password-es
  namespace: identity-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: identity-platform-db-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: idp/identity-platform/db-password
        property: password
