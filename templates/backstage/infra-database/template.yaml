apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: request-postgresql-database
  title: Request an AWS PostgreSQL Database
  description: Self-service template for a namespaced Crossplane PostgreSQL request.
  tags:
    - aws
    - crossplane
    - rds
spec:
  owner: platform-engineering
  type: resource

  parameters:
    - title: Resource Configuration
      required:
        - resource_name
        - storage_gb
        - size
        - owner
        - expires_on
        - password_secret_name
      properties:
        resource_name:
          title: Resource Name
          type: string
          description: DNS-safe name for the database request (for example, app-db).
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40
          ui:autofocus: true
        storage_gb:
          title: Storage (GiB)
          type: integer
          minimum: 20
          maximum: 1000
          default: 20
        size:
          title: Tier Size
          type: string
          enum:
            - small
            - medium
          default: small
          description: Approved platform tier enforced by the Crossplane API schema.
        owner:
          title: Requesting Team
          type: string
          enum:
            - identity-platform
            - platform-engineering
            - data-platform
        expires_on:
          title: Ownership review date
          type: string
          format: date
          description: Review resource ownership and ongoing cost by this date; no automatic deletion.
        password_secret_name:
          title: Password secret name
          type: string
          description: Name of an existing secret below the requesting team's idp/<team>/ path in AWS Secrets Manager.
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 40

  steps:
    - id: fetch-claim-template
      name: Generate Namespaced PostgreSQL Request
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: infrastructure/crossplane/claims/${{ parameters.owner }}/${{ parameters.resource_name }}
        values:
          resource_name: ${{ parameters.resource_name }}
          storage_gb: ${{ parameters.storage_gb }}
          size: ${{ parameters.size }}
          owner: ${{ parameters.owner }}
          expires_on: ${{ parameters.expires_on }}
          password_secret_name: ${{ parameters.password_secret_name }}

    - id: publish-pr
      name: Create Pull Request to Infrastructure Repository
      action: publish:github:pull-request
      input:
        repoUrl: github.com?repo=Internal-Developer-Platform&owner=amr-elzoghby
        branchName: infra-claim-${{ parameters.owner }}-${{ parameters.resource_name }}
        title: "feat(crossplane): add PostgreSQL request for ${{ parameters.owner }}"
        description: Namespaced PostgreSQL request submitted through the platform Golden Path.

  output:
    links:
      - title: Infrastructure Pull Request
        url: ${{ steps['publish-pr'].output.remoteUrl }}
