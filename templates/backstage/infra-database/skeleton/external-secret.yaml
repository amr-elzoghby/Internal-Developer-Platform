apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ${{ values.resource_name }}-password
  namespace: ${{ values.owner }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: ${{ values.resource_name }}-password
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: idp/${{ values.owner }}/${{ values.password_secret_name }}
        property: password
