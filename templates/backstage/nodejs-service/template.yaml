apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-nodejs-microservice
  title: Create Node.js Microservice (Golden Path)
  description: Scaffold a Node.js Express service starter with Docker and Kubernetes manifests.
  tags:
    - nodejs
    - express
    - kubernetes
spec:
  owner: platform-engineering
  type: service

  parameters:
    - title: Service Configuration
      required:
        - component_id
        - owner
      properties:
        component_id:
          title: Component Name
          type: string
          description: Unique name for your microservice (e.g., payment-service)
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          maxLength: 63
          ui:autofocus: true
        description:
          title: Description
          type: string
          description: Short explanation of what this service does
          default: Node.js Microservice
        owner:
          title: Owner Team
          type: string
          description: Select the platform-managed team that owns and runs this microservice
          enum:
            - identity-platform
            - platform-engineering
            - data-platform
          enumNames:
            - Identity Platform
            - Platform Engineering
            - Data Platform
  steps:
    - id: fetch-skeleton
      name: Fetch Golden Path Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.owner }}

    - id: publish-github
      name: Open Service Pull Request
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=amr-elzoghby&repo=Internal-Developer-Platform
        branchName: scaffold-${{ parameters.owner }}-${{ parameters.component_id }}
        targetBranchName: main
        targetPath: apps/${{ parameters.owner }}/${{ parameters.component_id }}
        title: 'feat: scaffold ${{ parameters.owner }}/${{ parameters.component_id }}'
        description: 'Review the service source and infrastructure prerequisites. Catalog registration follows merge; image publication and deployment promotion are separate reviewed steps.'
        update: false

  output:
    links:
      - title: Review Service Pull Request
        url: ${{ steps['publish-github'].output.remoteUrl }}
